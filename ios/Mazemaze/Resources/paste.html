<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- The paste page has no script of its own: nothing that was pasted can run. Text is put in by the app (textContent only). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>貼り付けて翻訳</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; padding: 12px 16px 32px; font: 17px/1.85 -apple-system, "Hiragino Sans", sans-serif; background: Canvas; color: CanvasText; }
  #out > div { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 0.7em; }
  #out > div.blank { margin: 0; height: 1em; }
</style>
</head>
<body>
<main id="out" aria-label="貼り付けた文章"></main>
</body>
</html>
