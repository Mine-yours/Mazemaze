<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>X風（viewport-fit=cover・固定ヘッダー）</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 16px/1.5 -apple-system, sans-serif; }
  /* Like X: the page itself decides where its header goes; it does not pad for the status bar. */
  #hdr { position: fixed; top: 0; left: 0; right: 0; height: 53px; background: #16181c; border-bottom: 1px solid #333; padding: 0 16px; display: flex; align-items: center; z-index: 10; }
  #hdr input { flex: 1; height: 36px; border-radius: 18px; border: 0; padding: 0 14px; background: #202327; color: #fff; }
  #tabs { position: sticky; top: 53px; height: 50px; background: #000; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 16px; }
  main { padding: 53px 16px 800px; }
  article p { margin: 0 0 40px; }
</style></head>
<body>
<div id="hdr"><input id="search" placeholder="検索（ヘッダーの検索欄）"></div>
<main>
  <div id="tabs">話題を検索 ・ トレンド ・ ニュース</div>
  <article><p>今日はとても良い天気で、友達と一緒に公園へ散歩に行きました。</p><p>二つ目の段落の日本語の文章です。順番に読まれます。</p>
  <p>三つ目の段落の日本語の文章です。ここにも十分な長さがあります。</p><p>四つ目の段落の日本語の文章です。ここにも十分な長さがあります。</p></article>
</main>
</body></html>
