<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>水和風</title></head>
<body><main><p id="h">水和の最中に更新される日本語の段落です。完了するまで触れません。</p></main>
<script>
  // Keeps mutating the DOM for ~1.8 s, like a client-side framework hydrating after load.
  var n = 0, t0 = Date.now();
  window.__hydrating = true;
  var iv = setInterval(function () {
    document.querySelector("main").setAttribute("data-tick", String(++n));
    if (Date.now() - t0 > 1800) { clearInterval(iv); window.__hydrating = false; }
  }, 100);
</script></body></html>
