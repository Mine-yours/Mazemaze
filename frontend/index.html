<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
  <title>mazemaze</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>mazemaze</h1>
      <p class="lead">日本語の文章の一部を英語に置き換えて読みます。お使いの Mac 上のローカルモデルで処理し、外部のサービスには送信しません。</p>
    </header>

    <section aria-labelledby="input-h">
      <h2 id="input-h" class="visually-hidden">入力</h2>
      <label for="input" class="label">日本語の文章</label>
      <textarea id="input" rows="8" maxlength="1000" autocomplete="off" spellcheck="false"
                placeholder="ここに日本語の文章を入力（1000文字まで）"></textarea>
      <p class="hint" id="count-line"><span id="count">0</span> / 1000 文字<span id="count-note"></span></p>

      <div class="settings">
        <div class="field">
          <label for="ratio">英語化率の目安：<output id="ratio-out">30%</output></label>
          <input id="ratio" type="range" min="10" max="70" step="5" value="30">
          <p class="hint">目標値であり、保証ではありません。</p>
        </div>
        <fieldset class="field">
          <legend>置き換える単位</legend>
          <label class="choice"><input type="radio" name="unit" value="phrase" checked> フレーズ</label>
          <label class="choice"><input type="radio" name="unit" value="sentence"> 文</label>
        </fieldset>
      </div>

      <button id="run" type="button" class="primary">変換する</button>
      <p id="progress" class="progress" hidden><span role="status" id="progress-msg">変換しています。最大約3分かかります。途中でやめることはできません。</span> <span id="elapsed" aria-hidden="true"></span></p>
    </section>

    <section id="error" class="error" role="alert" tabindex="-1" hidden>
      <p id="error-msg"></p>
      <button id="retry" type="button">もう一度試す</button>
    </section>

    <section id="result-section" aria-labelledby="result-h" hidden>
      <h2 id="result-h" tabindex="-1">結果</h2>
      <p id="summary" class="summary" role="status"></p>
      <ul id="warnings" class="warnings"></ul>
      <div class="toolbar">
        <button id="copy" type="button">結果をコピー</button>
        <button id="toggle" type="button">元の文章に戻す</button>
      </div>
      <p id="copy-status" class="hint" role="status"></p>
      <textarea id="copy-fallback" class="copy-fallback" readonly rows="4" hidden aria-label="コピー用の文章"></textarea>
      <div id="result" class="result" lang="ja"></div>
      <div id="detail" class="detail" aria-live="polite">
        <p class="hint">下線の英語部分を押すと、元の日本語が表示されます。</p>
      </div>
      <p id="stats" class="hint"></p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
